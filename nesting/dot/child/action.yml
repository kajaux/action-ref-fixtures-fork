name: Commitish marker B
description: Isolated reference-resolution fixture
outputs:
  marker:
    description: Selected fixture marker
    value: ${{ steps.marker.outputs.value }}
runs:
  using: composite
  steps:
    - id: marker
      shell: bash
      run: |
        printf '%s\n' 'COMMITISH_MARKER=B'
        printf '%s\n' 'value=B' >> "$GITHUB_OUTPUT"
